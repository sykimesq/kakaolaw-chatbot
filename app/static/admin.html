<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>법률 상담 접수 관리</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
           margin: 0; background: #f4f6fb; color: #1a2233; }
    header { background: #1e3a8a; color: #fff; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 18px; }
    .wrap { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
            margin-bottom: 14px; overflow: hidden; }
    .card .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                  cursor: pointer; border-bottom: 1px solid #eef; }
    .card .head:hover { background: #f7f9ff; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; color: #fff; }
    .b-urgent { background: #d00000; }
    .b-completed { background: #2e6cff; }
    .b-collecting { background: #888; }
    .b-resolved { background: #1a8a4a; }
    .meta { font-size: 12px; color: #667; margin-left: auto; }
    .body { padding: 0 16px 16px; display: none; }
    .body.open { display: block; }
    .field { font-size: 13px; margin: 6px 0; }
    .field b { color: #1e3a8a; }
    .summary { background: #fff8e6; border-left: 4px solid #f0a500; padding: 8px 12px;
               border-radius: 4px; margin: 10px 0; font-size: 14px; white-space: pre-wrap; }
    .transcript { background: #f8f9fc; border: 1px solid #e3e7f0; border-radius: 6px;
                  padding: 10px 12px; font-size: 13px; max-height: 420px; overflow: auto; }
    .msg { display: flex; margin: 6px 0; }
    .msg .bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px;
                   white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
    .msg.user { justify-content: flex-end; }
    .msg.user .bubble { background: #1e3a8a; color: #fff; border-bottom-right-radius: 2px; }
    .msg.assistant { justify-content: flex-start; }
    .msg.assistant .bubble { background: #fff; border: 1px solid #dde3f0;
                             border-bottom-left-radius: 2px; color: #1a2233; }
    .msg .who { font-size: 11px; color: #889; margin-bottom: 2px; }
    .msg.user .who { text-align: right; }
    .empty { text-align: center; color: #889; padding: 40px; }
    .refresh { position: fixed; right: 20px; bottom: 20px; background: #1e3a8a; color: #fff;
               border: none; border-radius: 24px; padding: 10px 18px; cursor: pointer;
               box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .count { font-size: 13px; color: #445; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header><h1>⚖️ 법률 상담 접수 관리</h1></header>
  <div class="wrap">
    <div class="count" id="count">불러오는 중…</div>
    <div id="list"></div>
  </div>
  <button class="refresh" onclick="load()">새로고침</button>

  <script>
    const statusLabel = {
      수집중: ["b-collecting", "수집중"],
      완료: ["b-completed", "접수완료"],
      긴급: ["b-urgent", "긴급"],
      처리완료: ["b-resolved", "처리완료"],
    };

    async function load() {
      const res = await fetch("/admin/inquiries");
      const data = await res.json();
      const list = document.getElementById("list");
      document.getElementById("count").textContent =
        `총 ${data.length}건의 접수`;
      if (!data.length) {
        list.innerHTML = '<div class="empty">아직 접수된 상담이 없습니다.</div>';
        return;
      }
      list.innerHTML = "";
      for (const it of data) {
        const [cls, label] = statusLabel[it.status] || ["b-collecting", it.status];
        const card = document.createElement("div");
        card.className = "card";
        const head = document.createElement("div");
        head.className = "head";
        head.innerHTML = `
          <span class="badge ${cls}">${label}</span>
          <b>#${it.id}</b>
          <span>${it.field || "미분류"}</span>
          ${it.urgent ? '<span class="badge b-urgent">긴급신호</span>' : ""}
          <span class="meta">${it.created_at || ""}</span>`;
        const body = document.createElement("div");
        body.className = "body";
        const transcriptHtml = (it.transcript || "")
          .split("\n")
          .map((line) => {
            if (line.startsWith("고객:"))
              return `<div class="msg user"><div><div class="who">상담자</div><div class="bubble">${escapeHtml(line.slice(3))}</div></div></div>`;
            if (line.startsWith("상담사:"))
              return `<div class="msg assistant"><div><div class="who">챗봇</div><div class="bubble">${escapeHtml(line.slice(4))}</div></div></div>`;
            return `<div class="msg assistant"><div><div class="bubble">${escapeHtml(line)}</div></div></div>`;
          })
          .join("");
        body.innerHTML = `
          <div class="field"><b>사용자키:</b> ${escapeHtml(it.user_key || "-")}</div>
          <div class="field"><b>연락처:</b> ${escapeHtml(it.phone || "-")}</div>
          <div class="field"><b>입장:</b> ${escapeHtml(it.position || "-")}</div>
          <div class="summary"><b>요약</b>\n${escapeHtml(it.summary || "(없음)")}</div>
          <div class="field"><b>전체 대화 전문</b></div>
          <div class="transcript">${transcriptHtml || "(없음)"}</div>`;
        head.onclick = () => body.classList.toggle("open");
        card.append(head, body);
        list.append(card);
      }
    }

    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    load();
  </script>
</body>
</html>
