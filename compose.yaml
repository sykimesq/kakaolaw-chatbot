# =============================================================================
# 카카오 법률 챗봇 — 사무실 서버 배포 (kakaolaw.lawcalhost.com)
# Production Deployment Standard v1 (self-hosted-app-server 스킬 준수)
#   - web bound ONLY to 127.0.0.1:<WEB_PORT>
#   - SQLite named volume (kakaolaw-data) for persistence
#   - explicit image tag (never 'latest')
#   - healthcheck, restart: unless-stopped, log rotation, memory limit
# =============================================================================

services:
  web:
    image: ${WEB_IMAGE}            # e.g. kakaolaw-web:2026.08.16 (explicit tag)
    build:
      context: .
    container_name: ${APP_NAME}-web
    restart: unless-stopped
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      # ── 추론(콜백) 모델 — 오픈빌더 useCallback 2단계 응답용 ──
      # ⚠️ environment는 명시 나열 방식이므로, .env에 값을 넣어도 여기에
      #    추가하지 않으면 컨테이너에 전달되지 않는다 (401 원인).
      - USE_CALLBACK=${USE_CALLBACK}
      - REASONING_MODELS=${REASONING_MODELS}
      - REASONING_TIMEOUT=${REASONING_TIMEOUT}
      - NOUS_PORTAL_API_KEY=${NOUS_PORTAL_API_KEY}
      - NOUS_BASE_URL=${NOUS_BASE_URL}
      - CALLBACK_ADAPTER=${CALLBACK_ADAPTER}
      # ── 관리자 페이지 인증 (HTTP Basic Auth) ──
      # 둘 다 채워야 활성화. 비어있으면 인증 없이 동작.
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # ── 변호사 접수 알림 채널 (notify.py) ──
      # Slack webhook으로 상담 접수 알림 수신 (선택 채널). 비어있으면 mock 폴백.
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      # 활성화할 알림 채널 목록 (admin_page 기본 ON, 여기서 slack 활성화)
      - LAWYER_NOTIFY_CHANNELS=${LAWYER_NOTIFY_CHANNELS}
      # 알림톡/카카오 비즈메시지 (필요 시 채워서 사용)
      - LAWYER_PHONE=${LAWYER_PHONE}
      - KAKAO_BIZ_TOKEN=${KAKAO_BIZ_TOKEN}
      - KAKAO_SENDER_KEY=${KAKAO_SENDER_KEY}
      - DATABASE_URL=sqlite:////app/data/kakaolaw.db
    volumes:
      # SQLite DB 영속화 — 컨테이너 재생성에도 데이터 유지
      - kakaolaw-data:/app/data
    ports:
      # LOCALHOST-ONLY binding. Cloudflare Tunnel reaches this port on 127.0.0.1.
      # target = container-internal port uvicorn listens on (8000).
      # published = host port exposed to localhost only (WEB_PORT, e.g. 8600).
      - target: 8000
        published: ${WEB_PORT}
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      # python:3.12-slim has no curl/wget — use python urllib.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kakaolaw-data:
