[project]
name = "kakaolaw-chatbot"
version = "0.1.0"
description = "카카오톡 법률사무소 챗봇 — 질의 수집 + 예약 관리"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# 시스템 프롬프트(한국어 법적 가이드)는 줄 길이 제한 제외
"app/services/llm_adapter.py" = ["E501"]
